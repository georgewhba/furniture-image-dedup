[project]
name = "furniture-dedup"
version = "1.0.0"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "A", "C4", "T10"]
ignore = ["S608"]  # SQL injection false positives in cache.py

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is standard in pytest
"validation/**" = ["S101"]

[tool.black]
line-length = 100
target-version = ["py310"]
